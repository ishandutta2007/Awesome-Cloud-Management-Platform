<svg viewBox="0 0 1200 360" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    
    <linearGradient id="grid-fade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 42px; fill: url(#title-grad); }
    .subtitle { font-family: system-ui, -apple-system, sans-serif; font-weight: 500; font-size: 18px; fill: #94a3b8; }
    .badge-text { font-family: system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 13px; fill: #e2e8f0; }
    
    /* Animations */
    @keyframes pulse {
      0%, 100% { opacity: 0.2; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.05); }
    }
    @keyframes float-slow {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes dash {
      to { stroke-dashoffset: -40; }
    }
    
    .pulse-glow { animation: pulse 6s ease-in-out infinite; transform-origin: center; }
    .floating { animation: float-slow 4s ease-in-out infinite; }
    .animated-stream { stroke-dasharray: 8 8; animation: dash 2s linear infinite; }
  </style>

  <!-- Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bg)" />

  <!-- Ambient Glow Circles (Background layer) -->
  <circle cx="200" cy="100" r="150" fill="#0284c7" opacity="0.15" class="pulse-glow" filter="url(#glow)" />
  <circle cx="1000" cy="260" r="180" fill="#6366f1" opacity="0.15" class="pulse-glow" filter="url(#glow)" />

  <!-- Dynamic Tech Grid & Nodes (Background / Decorative Sides) -->
  <g stroke="#334155" stroke-width="1" opacity="0.3">
    <path d="M0 60 H1200 M0 120 H1200 M0 180 H1200 M0 240 H1200 M0 300 H1200" />
    <path d="M150 0 V360 M300 0 V360 M450 0 V360 M600 0 V360 M750 0 V360 M900 0 V360 M1050 0 V360" />
  </g>

  <!-- Flow lines running on sides -->
  <path d="M 50 180 Q 200 80 350 180 T 650 180" fill="none" stroke="#0EA5E9" stroke-width="2" class="animated-stream" opacity="0.4" />
  <path d="M 550 180 Q 750 280 950 180 T 1150 180" fill="none" stroke="#818CF8" stroke-width="2" class="animated-stream" opacity="0.4" />

  <!-- Side Floating Elements (Cloud & Metric Badges) -->
  <!-- Left Cloud Node -->
  <g class="floating" transform="translate(70, 70)">
    <rect width="140" height="50" rx="10" fill="url(#card-grad)" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.5" />
    <circle cx="30" cy="25" r="12" fill="#0284c7" opacity="0.3" />
    <path d="M24 27 a 6 6 0 0 1 11 -2 a 4 4 0 0 1 3 4 a 4 4 0 0 1 -3 4 h -11 a 4 4 0 0 1 0 -6" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="52" y="30" class="badge-text">Multi-Cloud</text>
  </g>

  <!-- Right FinOps Node -->
  <g class="floating" transform="translate(980, 230)" style="animation-delay: -2s;">
    <rect width="140" height="50" rx="10" fill="url(#card-grad)" stroke="#818cf8" stroke-opacity="0.3" stroke-width="1.5" />
    <circle cx="30" cy="25" r="12" fill="#4f46e5" opacity="0.3" />
    <path d="M25 30 L25 22 M25 22 L32 22 M25 22 L32 29" fill="none" stroke="#818cf8" stroke-width="2" stroke-linecap="round" />
    <text x="52" y="30" class="badge-text">FinOps Ready</text>
  </g>

  <!-- Left Lower IaC Node -->
  <g class="floating" transform="translate(90, 240)" style="animation-delay: -1s;">
    <rect width="130" height="46" rx="10" fill="url(#card-grad)" stroke="#c084fc" stroke-opacity="0.3" stroke-width="1.5" />
    <text x="22" y="28" class="badge-text" fill="#c084fc">⚡ IaC &amp; CMP</text>
  </g>

  <!-- Main Center Header Container (Guarantees Foreground Title & Subtitle Visibility) -->
  <g transform="translate(600, 175)">
    <!-- Center Dark Backdrop Shield -->
    <rect x="-420" y="-105" width="840" height="210" rx="20" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1" filter="url(#glow)"/>
    
    <!-- Title -->
    <text x="0" y="-30" text-anchor="middle" class="title">Awesome Cloud Management Platform</text>

    <!-- Subtitle -->
    <text x="0" y="20" text-anchor="middle" class="subtitle">Curated SaaS &amp; Open-Source Tools for Cloud Orchestration &amp; Multi-Cloud Governance</text>

    <!-- Decorative Tags below subtitle -->
    <g transform="translate(0, 55)">
      <rect x="-180" y="-14" width="100" height="26" rx="13" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.4" />
      <text x="-130" y="3" text-anchor="middle" font-family="system-ui" font-size="12" font-weight="600" fill="#38bdf8">SaaS</text>

      <rect x="-60" y="-14" width="120" height="26" rx="13" fill="#1e293b" stroke="#818cf8" stroke-opacity="0.4" />
      <text x="0" y="3" text-anchor="middle" font-family="system-ui" font-size="12" font-weight="600" fill="#818cf8">Open Source</text>

      <rect x="80" y="-14" width="100" height="26" rx="13" fill="#1e293b" stroke="#c084fc" stroke-opacity="0.4" />
      <text x="130" y="3" text-anchor="middle" font-family="system-ui" font-size="12" font-weight="600" fill="#c084fc">FinOps</text>
    </g>
  </g>
</svg>
